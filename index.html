<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GV Enxovais</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--c:#e4b529;--t:#4f8d86;--td:#2f6660;--cr:#fff9e8}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--cr);color:#26413e;
background-image:radial-gradient(#e4b52922 2px,transparent 2px);background-size:26px 26px}
header{background:var(--c);display:flex;align-items:center;gap:12px;padding:8px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #0002}
header img{height:54px}header b{margin-right:auto;color:var(--td);font-size:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;border-radius:99px;padding:9px 16px;cursor:pointer;background:#ffffff66;color:var(--td);font:800 14px 'Nunito',sans-serif}
nav button:hover{background:#fff}nav button.on{background:var(--t);color:#fff}
main{max-width:1150px;margin:18px auto;padding:0 14px}
.btn{border:0;border-radius:99px;padding:9px 18px;cursor:pointer;background:var(--t);color:#fff;font:800 14px 'Nunito',sans-serif;transition:.15s}
.btn:hover{transform:translateY(-2px);background:var(--td)}.btn:disabled{opacity:.4}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 14px #4f8d8622;margin-bottom:14px;border:2px solid #4f8d8614}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.grid .card{padding:0;overflow:hidden;margin:0;transition:.2s}.grid .card:hover{transform:translateY(-5px);box-shadow:0 10px 22px #4f8d8633}
.grid .in{padding:12px 14px 14px}
.ph,.grid img{width:100%;height:170px;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#e4b52955,#4f8d8644)}
.price{font-size:22px;font-weight:900;color:var(--td)}
input,select,textarea{padding:10px 12px;border:2px solid #4f8d8633;border-radius:12px;width:100%;margin:4px 0;font:inherit;background:#fffdf6}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--t)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #4f8d8618;text-align:left}th{color:var(--td)}
td input{width:95px}.g{background:#3f9d5a}.r{background:#d9534f}
.box{max-width:400px;margin:0 auto}
.hero{background:linear-gradient(120deg,var(--t),#6aa9a1);color:#fff;border-radius:24px;padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden;background-size:cover;background-position:center;min-height:150px}
.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.95}
.hero:after{content:'🐾';position:absolute;right:18px;bottom:-10px;font-size:110px;opacity:.18;transform:rotate(-15deg)}
.hero.f:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#2f6660cc,#2f666033)}.hero *{position:relative}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--c) 55%,#f0cf62)}
.login .card{text-align:center;padding:26px;border-radius:28px}.login img{width:100%;max-width:300px}
.login:before,.login:after{content:'🐾';position:fixed;font-size:90px;opacity:.25;color:var(--td)}.login:before{left:6%;top:10%;transform:rotate(-20deg)}.login:after{right:6%;bottom:8%;transform:rotate(20deg)}
.chat{height:320px;overflow:auto;background:#fff9e8;padding:10px;border-radius:14px}
.m{max-width:75%;padding:7px 12px;border-radius:16px 16px 16px 4px;margin:5px 0;background:#e9ecec}.m.eu{margin-left:auto;background:var(--t);color:#fff;border-radius:16px 16px 4px 16px}
.tag{padding:3px 10px;border-radius:99px;background:#e4b52955;font-size:12px;font-weight:800;color:var(--td)}
footer{text-align:center;padding:26px;color:var(--td);font-weight:700}
</style></head><body><div id="app"></div>

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me,cfg={},tab,cart={},prods=[],peds=[],chatWith=null;
const $=s=>document.querySelector(s),app=$('#app');
const R=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const TABS={cliente:['catalogo','carrinho','pedidos','chat'],admin:['produtos','clientes','pedidos','chat','config'],producao:['pedidos']};
const ST={novo:'Novo',em_producao:'Em produção',pronto:'Pronto',entregue:'Entregue'};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  cfg=(await sb.from('config').select().eq('id',1).single()).data||{};
  if(cfg.cor&&!['#1e40af','#548f88'].includes(cfg.cor.toLowerCase()))document.documentElement.style.setProperty('--c',cfg.cor);document.title=cfg.nome_loja||'GV Enxovais';
  if(!session)return loginView();
  me=(await sb.from('profiles').select().eq('id',session.user.id).single()).data;
  if(!me)return loginView();
  if(!me.aprovado)return shell('<div class="card"><h3>Cadastro em análise</h3><p>Aguarde a aprovação do administrador.</p></div>',[]);
  tab=TABS[me.role][0];go(tab);
}
function shell(html,tabs){
  app.innerHTML=`<header><img src="${cfg.logo_url||LOGO}" alt="${cfg.nome_loja||'GV Enxovais'}"><b>${cfg.nome_loja||'GV Enxovais'}</b>
  <nav>${tabs.map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${t[0].toUpperCase()+t.slice(1)}${t=='carrinho'?' ('+Object.keys(cart).length+')':''}</button>`).join(' ')}
  <button onclick="sair()">Sair</button></nav></header><main>${html}</main><footer>🐾 ${cfg.nome_loja||'GV Enxovais'} · Atacado para pet shops</footer>`;
}
async function sair(){await sb.auth.signOut();location.reload()}
function loginView(mode='login'){
  const c=mode=='cad';
  app.innerHTML=`<div class="login"><div class="box card"><img src="${cfg.logo_url||LOGO}"><p style="margin:0 0 10px;font-weight:800;color:var(--td)">Atacado para pet shops e lojas pet 🐶🐱</p>
  ${c?'<input id="nome" placeholder="Nome"><input id="emp" placeholder="Empresa"><input id="tel" placeholder="Telefone com DDD">':''}
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Senha (mín. 6)">
  <button class="btn" style="width:100%" onclick="${c?'cadastrar()':'entrar()'}">${c?'Cadastrar':'Entrar'}</button>
  <p style="text-align:center"><a href="#" onclick="loginView('${c?'login':'cad'}');return false">${c?'Já tenho conta':'Criar cadastro'}</a></p></div>`;
}
async function entrar(){
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  error?alert('Erro: '+error.message):init();
}
async function cadastrar(){
  const {error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value,options:{data:{nome:$('#nome').value,telefone:$('#tel').value,empresa:$('#emp').value}}});
  if(error)return alert(error.message);
  alert('Cadastro enviado! Aguarde aprovação do administrador.');init();
}
async function up(file){
  const p=Date.now()+'-'+file.name.replace(/[^\w.]/g,'');
  const {error}=await sb.storage.from('publico').upload(p,file);
  if(error){alert(error.message);return null}
  return sb.storage.from('publico').getPublicUrl(p).data.publicUrl;
}
async function go(t){
  tab=t;shell('Carregando...',TABS[me.role]);
  const v={catalogo,carrinho,pedidos,chat,produtos,clientes,config}[t];
  const h=await v();shell(h,TABS[me.role]);if(t=='chat')loadChat();
}
/* ---------- CLIENTE ---------- */
async function catalogo(){
  prods=(await sb.from('produtos').select().eq('ativo',true).order('nome')).data||[];
  return `<div class="hero ${cfg.hero_url?'f':''}" ${cfg.hero_url?`style="background-image:url('${cfg.hero_url}')"`:''}><h2>Enxovais pet direto da fábrica 🐾</h2><p>Caminhas, cobertores e mantas com preço de atacado. Monte seu pedido e combine a retirada.</p></div>`+'<div class="grid">'+prods.map(p=>`<div class="card">${p.foto_url?`<img src="${p.foto_url}" alt="${p.nome}">`:'<div class="ph">🐶</div>'}
  <div class="in"><h4 style="margin:0 0 2px;font-size:17px">${p.nome}</h4><small>${p.descricao||''}</small>
  <p style="margin:8px 0"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${p.cor};border:2px solid #0002;vertical-align:middle"></span> <span class="price">${R(p.preco)}</span><br><small>${p.quantidade>0?'Estoque: '+p.quantidade+' un.':'<b style="color:#d9534f">Esgotado</b>'}</small></p>
  <input type="number" min="1" max="${p.quantidade}" value="1" id="q${p.id}">
  <button class="btn" style="width:100%" ${p.quantidade<1?'disabled':''} onclick="add(${p.id})">🛒 Adicionar</button></div></div>`).join('')+'</div>';
}
function add(id){cart[id]=(cart[id]||0)+Number($('#q'+id).value||1);alert('Adicionado!');shell($('main').innerHTML,TABS[me.role])}
async function carrinho(){
  if(!prods.length)prods=(await sb.from('produtos').select()).data||[];
  const ids=Object.keys(cart);if(!ids.length)return '<div class="card">Carrinho vazio.</div>';
  let tot=0;const rows=ids.map(i=>{const p=prods.find(x=>x.id==i),s=p.preco*cart[i];tot+=s;return `<tr><td>${p.nome}</td><td>${cart[i]}</td><td>${R(s)}</td><td><button class="btn r" onclick="delete cart[${i}];go('carrinho')">x</button></td></tr>`}).join('');
  return `<div class="card"><table>${rows}</table><h3>Total: ${R(tot)}</h3>
  <input id="pn" value="${me.nome||''}" placeholder="Nome"><input id="pe" value="${me.email||''}" placeholder="Email">
  <input id="pt" value="${me.telefone||''}" placeholder="Telefone">
  <label>Horário desejado para ficar pronto</label><input id="ph" type="datetime-local">
  <button class="btn g" onclick="finalizar(${tot})">Enviar pedido</button></div>`;
}
async function finalizar(total){
  const itens=Object.keys(cart).map(i=>{const p=prods.find(x=>x.id==i);return{id:p.id,nome:p.nome,qtd:cart[i],preco:p.preco}});
  const {error}=await sb.from('pedidos').insert({cliente_id:me.id,nome:$('#pn').value,email:$('#pe').value,telefone:$('#pt').value,hora_pronto:$('#ph').value,itens,total});
  if(error)return alert(error.message);cart={};alert('Pedido enviado!');go('pedidos');
}
/* ---------- PEDIDOS (cliente, admin, produção) ---------- */
async function pedidos(){
  peds=(await sb.from('pedidos').select().order('id',{ascending:false})).data||[];
  const staff=me.role!='cliente';
  return peds.map(p=>`<div class="card"><b>#${p.id}</b> · ${p.nome} · ${p.telefone||''} · ${R(p.total)} · <span class="tag">${ST[p.status]}</span>
  <div><small>${(p.itens||[]).map(i=>i.qtd+'x '+i.nome).join(', ')}</small></div>
  ${staff?`<p>Status: <select onchange="updPed(${p.id},'status',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==p.status?'selected':''}>${v}</option>`).join('')}</select>
  Pronto às: <input type="datetime-local" value="${p.hora_pronto||''}" style="width:auto" onchange="updPed(${p.id},'hora_pronto',this.value)"></p>
  <button class="btn g" onclick="wa(${p.id},'recebido')">WhatsApp: recebido</button>
  <button class="btn" onclick="wa(${p.id},'producao')">WhatsApp: em produção</button>
  <button class="btn g" onclick="wa(${p.id},'pronto')">WhatsApp: pronto</button>
  <button class="btn r" onclick="wa(${p.id},'atraso')">WhatsApp: atraso</button>`:`<small>Pronto às: ${p.hora_pronto?p.hora_pronto.replace('T',' '):'a definir'}</small>`}</div>`).join('')||'<div class="card">Sem pedidos.</div>';
}
async function updPed(id,k,v){const {error}=await sb.from('pedidos').update({[k]:v}).eq('id',id);if(error)alert(error.message)}
function wa(id,tipo){
  const p=peds.find(x=>x.id==id),h=p.hora_pronto?p.hora_pronto.replace('T',' às '):'em breve';
  const M={recebido:`Olá ${p.nome}! Recebemos seu pedido #${p.id} (${R(p.total)}). Previsão: ${h}.`,
  producao:`Olá ${p.nome}, seu pedido #${p.id} entrou em produção. Previsão: ${h}.`,
  pronto:`Olá ${p.nome}! Seu pedido #${p.id} está pronto para retirada. Obrigado pela preferência!`,
  atraso:`Olá ${p.nome}, seu pedido #${p.id} sofreu um pequeno atraso. Nova previsão: ${h}. Pedimos desculpas.`};
  const n=(p.telefone||'').replace(/\D/g,'');
  window.open(`https://wa.me/${n.length<=11?'55'+n:n}?text=${encodeURIComponent(M[tipo])}`,'_blank');
}
/* ---------- CHAT ---------- */
async function chat(){
  let sel='';
  if(me.role=='admin'){
    const cl=(await sb.from('profiles').select().eq('role','cliente').eq('aprovado',true)).data||[];
    if(!chatWith&&cl[0])chatWith=cl[0].id;
    sel=`<select onchange="chatWith=this.value;loadChat()">${cl.map(c=>`<option value="${c.id}" ${c.id==chatWith?'selected':''}>${c.nome||c.email}</option>`).join('')}</select>`;
  }else chatWith=me.id;
  return `<div class="card"><h3>Chat de dúvidas</h3>${sel}<div class="chat" id="cb"></div>
  <input id="ct" placeholder="Digite sua mensagem" onkeydown="if(event.key=='Enter')envia()"><button class="btn" onclick="envia()">Enviar</button></div>`;
}
async function loadChat(){
  if(tab!='chat'||!chatWith||!$('#cb'))return;
  const d=(await sb.from('mensagens').select().eq('cliente_id',chatWith).order('id')).data||[];
  $('#cb').innerHTML=d.map(m=>`<div class="m ${m.de==me.id?'eu':''}">${m.texto.replace(/</g,'&lt;')}<br><small>${new Date(m.criado).toLocaleString('pt-BR')}</small></div>`).join('');
  $('#cb').scrollTop=1e9;
}
async function envia(){
  const t=$('#ct').value.trim();if(!t||!chatWith)return;
  await sb.from('mensagens').insert({cliente_id:chatWith,de:me.id,texto:t});$('#ct').value='';loadChat();
}
setInterval(loadChat,4000);
/* ---------- ADMIN ---------- */
async function produtos(){
  prods=(await sb.from('produtos').select().order('id')).data||[];
  return `<div class="card"><h3>Novo produto</h3><input id="n" placeholder="Nome"><textarea id="d" placeholder="Descrição"></textarea>
  <input id="pr" type="number" step="0.01" placeholder="Preço"><input id="qt" type="number" placeholder="Quantidade">
  Cor: <input id="co" type="color" value="#1e40af" style="width:60px"> Foto: <input id="fo" type="file" accept="image/*">
  <button class="btn g" onclick="novoP()">Adicionar produto</button></div>
  <div class="card" style="overflow:auto"><table><tr><th>Foto</th><th>Nome</th><th>Preço</th><th>Qtd</th><th>Cor</th><th>Ativo</th><th></th></tr>
  ${prods.map(p=>`<tr><td><img src="${p.foto_url||''}" width=40 height=40 style="object-fit:cover"><input type="file" style="width:100px" onchange="trocaFoto(${p.id},this.files[0])"></td>
  <td><input style="width:140px" value="${p.nome}" onchange="updP(${p.id},'nome',this.value)"></td>
  <td><input type="number" step="0.01" value="${p.preco}" onchange="updP(${p.id},'preco',this.value)"></td>
  <td><input type="number" value="${p.quantidade}" onchange="updP(${p.id},'quantidade',this.value)"></td>
  <td><input type="color" style="width:50px" value="${p.cor}" onchange="updP(${p.id},'cor',this.value)"></td>
  <td><input type="checkbox" style="width:auto" ${p.ativo?'checked':''} onchange="updP(${p.id},'ativo',this.checked)"></td>
  <td><button class="btn r" onclick="delP(${p.id})">Excluir</button></td></tr>`).join('')}</table></div>`;
}
async function novoP(){
  const f=$('#fo').files[0],foto=f?await up(f):null;
  const {error}=await sb.from('produtos').insert({nome:$('#n').value,descricao:$('#d').value,preco:$('#pr').value||0,quantidade:$('#qt').value||0,cor:$('#co').value,foto_url:foto});
  error?alert(error.message):go('produtos');
}
async function updP(id,k,v){const {error}=await sb.from('produtos').update({[k]:v}).eq('id',id);if(error)alert(error.message)}
async function trocaFoto(id,f){if(!f)return;const u=await up(f);if(u){await updP(id,'foto_url',u);go('produtos')}}
async function delP(id){if(confirm('Excluir?')){await sb.from('produtos').delete().eq('id',id);go('produtos')}}
async function clientes(){
  const d=(await sb.from('profiles').select().order('criado',{ascending:false})).data||[];
  return '<div class="card" style="overflow:auto"><table><tr><th>Nome</th><th>Empresa</th><th>Email</th><th>Telefone</th><th>Perfil</th><th>Status</th><th></th></tr>'+
  d.map(c=>`<tr><td>${c.nome||''}</td><td>${c.empresa||''}</td><td>${c.email}</td><td>${c.telefone||''}</td><td>${c.role}</td>
  <td>${c.aprovado?'Aprovado':'<b>Pendente</b>'}</td><td>${c.role=='admin'?'':`<button class="btn ${c.aprovado?'r':'g'}" onclick="aprova('${c.id}',${!c.aprovado})">${c.aprovado?'Bloquear':'Aprovar'}</button>`}</td></tr>`).join('')+'</table></div>';
}
async function aprova(id,v){await sb.from('profiles').update({aprovado:v}).eq('id',id);go('clientes')}
async function config(){
  return `<div class="card"><h3>Identidade da loja</h3><label>Nome</label><input id="cn" value="${cfg.nome_loja||''}">
  <label>Cor principal</label><input id="cc" type="color" value="${cfg.cor||'#1e40af'}" style="width:80px">
  <label>Logo (vazio = logo GV Enxovais)</label><input id="cl" type="file" accept="image/*">
  <label>Foto de capa do catálogo</label><input id="ch" type="file" accept="image/*"><button class="btn g" onclick="salvaCfg()">Salvar</button></div>`;
}
async function salvaCfg(){
  const f=$('#cl').files[0],u={nome_loja:$('#cn').value,cor:$('#cc').value};if(f)u.logo_url=await up(f);const hf=$('#ch').files[0];if(hf)u.hero_url=await up(hf);
  const {error}=await sb.from('config').update(u).eq('id',1);error?alert(error.message):location.reload();
}
init();
</script></body></html>
